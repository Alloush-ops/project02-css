<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Pinned navigation bar -->
    <nav class="fixed-nav">
        Pinned Navigation Bar
    </nav>

    <div class="content-wrapper">
        <!-- 2. Card container -->
        <div class="card">
            <h3>Alert</h3>
            <p>This card contains an anchored badge.</p>
            <!-- 3. Absolute notification badge -->
            <span class="badge">99+</span>
        </div>
    </div>

    <!-- 4. Fixed back-to-top button -->
    <button class="back-to-top">Top</button>
</body>
</html>
